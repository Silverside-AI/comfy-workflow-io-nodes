# Optional: `pip install pre-commit && pre-commit install` runs the contract
# check before each commit that touches api_nodes/ (working tree vs origin/main).
repos:
  - repo: local
    hooks:
      - id: contract-check
        name: Workflow IO contract check (additive-only vs origin/main)
        entry: python3 tools/check_contract.py
        language: system
        files: ^api_nodes/
        pass_filenames: false
