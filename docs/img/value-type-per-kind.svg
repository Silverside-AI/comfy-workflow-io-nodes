<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Left: without filtering, a Float input's value_type dropdown lists every meaning, including aspect_ratio and frame_count, which make no sense for a Float. Right: with this change it lists only none, strength and degrees. Choosing strength lets Brand Brain show a slider.">
  <rect width="760" height="360" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Panel A -->
    <rect x="20" y="16" width="340" height="4" fill="#c2412d"/>
    <text x="20" y="42" font-size="14" font-weight="700" fill="#1b1f27">Without filtering</text>
    <text x="20" y="60" font-size="12" fill="#5d6573">Every input lists every meaning</text>
    <!-- Panel B -->
    <rect x="400" y="16" width="340" height="4" fill="#2f8a5b"/>
    <text x="400" y="42" font-size="14" font-weight="700" fill="#1b1f27">With this PR</text>
    <text x="400" y="60" font-size="12" fill="#5d6573">A Float lists only meanings for numbers</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">
    <!-- Node A -->
    <rect x="40" y="76" width="260" height="96" rx="8" fill="#ffffff" stroke="#c9ced8"/>
    <path d="M40 84a8 8 0 0 1 8-8h244a8 8 0 0 1 8 8v18H40z" fill="#2c3340"/>
    <text x="52" y="95" fill="#f2f4f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Workflow IO Float Input</text>
    <rect x="50" y="112" width="240" height="22" rx="11" fill="#eef0f4"/>
    <text x="62" y="127" fill="#5d6573">value</text><text x="278" y="127" fill="#1b1f27" text-anchor="end">0.60</text>
    <rect x="50" y="140" width="240" height="22" rx="11" fill="#e3ebfb" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="62" y="155" fill="#5d6573">value_type</text><text x="266" y="155" fill="#1b1f27" text-anchor="end">none</text>
    <path d="M272 150h8l-4 5z" fill="#3b6fd8"/>
    <!-- Menu A -->
    <rect x="130" y="168" width="180" height="120" rx="6" fill="#ffffff" stroke="#c9ced8"/>
    <text x="142" y="187" fill="#1b1f27">none</text>
    <rect x="131" y="194" width="178" height="22" fill="#fbe9e5"/>
    <text x="142" y="209" fill="#c2412d" text-decoration="line-through">aspect_ratio</text><text x="298" y="209" fill="#c2412d" text-anchor="end">✕</text>
    <text x="142" y="231" fill="#1b1f27">strength</text>
    <text x="142" y="253" fill="#1b1f27">degrees</text>
    <rect x="131" y="260" width="178" height="22" fill="#fbe9e5"/>
    <text x="142" y="275" fill="#c2412d" text-decoration="line-through">frame_count</text><text x="298" y="275" fill="#c2412d" text-anchor="end">✕</text>

    <!-- Node B -->
    <rect x="420" y="76" width="260" height="96" rx="8" fill="#ffffff" stroke="#c9ced8"/>
    <path d="M420 84a8 8 0 0 1 8-8h244a8 8 0 0 1 8 8v18H420z" fill="#2c3340"/>
    <text x="432" y="95" fill="#f2f4f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Workflow IO Float Input</text>
    <rect x="430" y="112" width="240" height="22" rx="11" fill="#eef0f4"/>
    <text x="442" y="127" fill="#5d6573">value</text><text x="658" y="127" fill="#1b1f27" text-anchor="end">0.60</text>
    <rect x="430" y="140" width="240" height="22" rx="11" fill="#e3ebfb" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="442" y="155" fill="#5d6573">value_type</text><text x="646" y="155" fill="#1b1f27" text-anchor="end">strength</text>
    <path d="M652 150h8l-4 5z" fill="#3b6fd8"/>
    <!-- Menu B -->
    <rect x="510" y="168" width="180" height="76" rx="6" fill="#ffffff" stroke="#c9ced8"/>
    <text x="522" y="187" fill="#1b1f27">none</text>
    <rect x="511" y="194" width="178" height="22" fill="#e3ebfb"/>
    <text x="522" y="209" fill="#1b1f27" font-weight="600">strength</text><text x="678" y="209" fill="#2f8a5b" text-anchor="end">✓</text>
    <text x="522" y="231" fill="#1b1f27">degrees</text>
  </g>

  <!-- Result strip -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <line x1="20" y1="312" x2="740" y2="312" stroke="#c9ced8"/>
    <text x="20" y="340" font-size="13" fill="#1b1f27">The node says what the value <tspan font-weight="700">means</tspan>:</text>
    <rect x="262" y="324" width="104" height="24" rx="12" fill="#e3ebfb" stroke="#3b6fd8"/>
    <text x="314" y="340" font-size="12" fill="#3b6fd8" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">strength</text>
    <text x="382" y="341" font-size="16" fill="#5d6573">→</text>
    <text x="408" y="340" font-size="13" fill="#1b1f27">Brand Brain shows:</text>
    <rect x="534" y="333" width="110" height="6" rx="3" fill="#d6dbe3"/>
    <rect x="534" y="333" width="66" height="6" rx="3" fill="#3b6fd8"/>
    <circle cx="600" cy="336" r="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="2"/>
    <text x="656" y="340" font-size="12" fill="#5d6573">a slider</text>
  </g>
</svg>
