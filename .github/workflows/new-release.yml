name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Abort if develop has no changes ahead of main
        run: |
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::develop has no commits ahead of main. Nothing to release."
            exit 1
          fi

      - name: Read current version
        id: current
        run: |
          VERSION=$(python3 -c "import pathlib, re; t = pathlib.Path('pyproject.toml').read_text(); print(re.search(r'(?m)^version = \"([^\"]+)\"', t).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Abort if release branch already exists
        run: |
          BRANCH="release/${{ steps.bump.outputs.version }}"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "::error::Branch $BRANCH already exists on origin."
            exit 1
          fi

      - name: Bump version in pyproject.toml
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          python3 -c "
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path('pyproject.toml')
          text = path.read_text()
          new, n = re.subn(r'(?m)^version = \"[^\"]+\"', f'version = \"{version}\"', text, count=1)
          if n != 1:
              raise SystemExit('version line not found in pyproject.toml')
          path.write_text(new)
          " "$VERSION"

      - name: Commit and push to develop
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git add pyproject.toml
          git commit -m "chore: bump version to $VERSION"
          git push origin develop

      - name: Create and push release branch
        run: |
          BRANCH="release/${{ steps.bump.outputs.version }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

      - name: Summary
        run: |
          echo "### Release branch created" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous version | \`${{ steps.current.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New version      | \`${{ steps.bump.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch           | \`release/${{ steps.bump.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"

          MERGED_PRS=$(git log origin/main..HEAD --pretty=format:"%s" \
            | { grep -oE '#[0-9]+' || true; } \
            | { grep -oE '[0-9]+' || true; } \
            | sort -u \
            | while read -r pr_num; do
                gh pr view "$pr_num" --json number,title \
                  --jq '"- #\(.number) \(.title)"' 2>/dev/null || true
              done)

          BODY=$(printf "## What's included in %s\n\n%s" "$VERSION" "$MERGED_PRS")

          gh pr create \
            --base main \
            --head "release/$VERSION" \
            --title "release: $VERSION" \
            --body "$BODY"
