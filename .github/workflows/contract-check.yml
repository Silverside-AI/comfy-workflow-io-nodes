name: Contract check

# Fails a PR whose node changes would break workflows already saved in prod
# (see tools/check_contract.py and docs/comfy-json-ui-contract.md).
on:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base branch is read with `git archive`
      - name: Node definitions are additive vs the base branch
        run: python3 tools/check_contract.py --base "origin/${{ github.base_ref }}"
