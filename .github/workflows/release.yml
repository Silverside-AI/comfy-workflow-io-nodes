name: Publish Comfy nodes and BB contract

# Publishes the custom node zip (to upload to Comfy) and the generated
# TypeScript contract (for Brand Brain) as a GitHub Release.
#
# - patch, minor or major: from main only. Bumps the latest v* tag (v0.1.0 ->
#   v0.1.1 for a patch) and creates that release.
# - alpha: from any branch (pick it in "Use workflow from"). Creates or replaces
#   the pre-release alpha-<branch>, versioned as the latest release plus that
#   commit (0.1.0+alpha.<branch>.<sha>), and deleted when the branch's PR
#   closes (alpha-cleanup.yml).

on:
  workflow_dispatch:
    inputs:
      release:
        description: "alpha (any branch, for testing), or a version bump from the latest release (main only)"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - patch
          - minor
          - major

permissions:
  contents: write
  # To comment the alpha's links on the branch's pull request.
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: ${{ inputs.release }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          if [ "$RELEASE" != alpha ] && [ "$BRANCH" != main ]; then
            echo "::error::A $RELEASE release must run from main (this ran from $BRANCH). Pick alpha to test a branch."
            exit 1
          fi
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          MAJOR=${MAJOR:-0} MINOR=${MINOR:-0} PATCH=${PATCH:-0}
          case "$RELEASE" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          if [ "$RELEASE" != alpha ]; then
            TAG="v$NEXT" PYPROJECT_VERSION="$NEXT"
            ZIP="comfy-workflow-io-nodes-$NEXT.zip"
          else
            # Same slug as alpha-cleanup.yml: sil-1714-value-type
            SLUG=$(echo "$BRANCH" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-60 | sed -E 's/-+$//')
            SHA=$(git rev-parse --short=7 HEAD)
            # The tag has no commit, so each run replaces the branch's alpha.
            TAG="alpha-$SLUG"
            # The latest release plus this commit, as a PEP 440 local version,
            # so Comfy shows the installed pack is an alpha and of which commit.
            PYPROJECT_VERSION="$MAJOR.$MINOR.$PATCH+alpha.$SLUG.$SHA"
            ZIP="comfy-workflow-io-nodes-alpha-$SLUG-$SHA.zip"
          fi
          {
            echo "latest=$LATEST"
            echo "tag=$TAG"
            echo "pyproject_version=$PYPROJECT_VERSION"
            echo "zip=$ZIP"
          } >> "$GITHUB_OUTPUT"

      - name: Build the custom node zip and the contract
        env:
          ZIP: ${{ steps.v.outputs.zip }}
          PYPROJECT_VERSION: ${{ steps.v.outputs.pyproject_version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$PYPROJECT_VERSION\"/" pyproject.toml
          # Only what ComfyUI loads, in a folder without the version, so a newer
          # upload replaces the node pack instead of adding a second copy.
          git archive --format=zip --prefix=comfy-workflow-io-nodes/ -o "$ZIP" \
            --add-file=pyproject.toml HEAD \
            __init__.py api_nodes web requirements.txt README.md
          python3 scripts/generate_workflow_io_contract.py --release "$TAG"

      - name: Create the release
        if: inputs.release != 'alpha'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          LATEST: ${{ steps.v.outputs.latest }}
          ZIP: ${{ steps.v.outputs.zip }}
        run: |
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "Upload \`$ZIP\` to Comfy. The \"Source code\" archives below are the whole repo, added by GitHub to every release." \
            --generate-notes ${LATEST:+--notes-start-tag "$LATEST"} \
            "$ZIP" dist/workflow-io-contract.ts

      - name: Create or replace the alpha
        if: inputs.release == 'alpha'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          ZIP: ${{ steps.v.outputs.zip }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --target "$SHA" \
            --prerelease \
            --title "Alpha: $BRANCH" \
            --notes "Alpha of \`$BRANCH\` at ${SHA:0:7}, for testing only. Upload \`$ZIP\` to a scratch Comfy workspace: it replaces the released Workflow IO Nodes there. Running the alpha again replaces this one, and it's deleted when the branch's pull request closes." \
            "$ZIP" dist/workflow-io-contract.ts

      - name: Link the zip in the run summary
        env:
          TAG: ${{ steps.v.outputs.tag }}
          ZIP: ${{ steps.v.outputs.zip }}
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          {
            echo "### $TAG ready"
            echo
            echo "- Zip to upload to Comfy: [$ZIP]($BASE/download/$TAG/$ZIP)"
            echo "- Contract: [workflow-io-contract.ts]($BASE/download/$TAG/workflow-io-contract.ts)"
            echo "- Release: $BASE/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link the alpha on the branch's pull request
        if: inputs.release == 'alpha'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          ZIP: ${{ steps.v.outputs.zip }}
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases
          REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open pull request for $BRANCH: the links are in the run summary only."
            exit 0
          fi
          # One comment per pull request, edited on each run, found by this marker.
          MARKER="<!-- workflow-io-alpha -->"
          BODY="$MARKER
          **Alpha of this branch** at $(git rev-parse --short=7 HEAD), for testing only: upload [\`$ZIP\`]($BASE/download/$TAG/$ZIP) to a scratch Comfy workspace.
          Contract: [\`workflow-io-contract.ts\`]($BASE/download/$TAG/workflow-io-contract.ts) · [Release]($BASE/tag/$TAG)"
          COMMENT=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT" -f body="$BODY" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
          fi
