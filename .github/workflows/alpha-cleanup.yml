name: Alpha cleanup

# Deletes a branch's alpha pre-release (see release.yml) when its pull request
# closes, merged or not.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    # Forks get a read-only token, and their branches never have an alpha here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete the alpha and its tag
        run: |
          # Same slug as release.yml
          SLUG=$(echo "$BRANCH" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-60 | sed -E 's/-+$//')
          gh release delete "alpha-$SLUG" --cleanup-tag --yes --repo "${{ github.repository }}" || true
